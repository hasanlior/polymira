[package]
name = "orbis"
version = "0.1.0"
edition = "2021"
description = "POLYMIRA Orbis: experimental PS4 executable loader and analyzer"
license-file = "../../LICENSE"
publish = false

[dependencies]
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ash = "0.38"
png = "0.17"
half = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = 2
lto = true
strip = true
